<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recortador de fotos dentales</title>
  <meta name="description" content="Recorta las fotos clínicas del paciente y arma la presentación. Todo ocurre en esta computadora.">
  <meta name="theme-color" content="#0b4f8a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
  <link rel="icon" href="iconos/icono-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="iconos/icono-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="saltar" href="#pantalla">Ir al contenido</a>
  <header class="cabecera">
    <p class="titulo-app">Recortador de fotos dentales</p>
    <ol class="pasos" id="pasos" aria-label="Pasos"></ol>
  </header>

  <main id="pantalla" tabindex="-1">
    <div id="cargando" class="cargando">
      <p>Abriendo el recortador…</p>
    </div>
  </main>

  <footer class="navegacion">
    <button id="atras" class="boton secundario" type="button" hidden>← Atrás</button>
    <p id="ayuda-nav" class="ayuda-nav" aria-live="polite"></p>
    <button id="siguiente" class="boton principal" type="button">Siguiente →</button>
  </footer>

  <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>

  <div id="espera" class="espera" hidden>
    <div class="espera-caja" role="status" aria-live="polite">
      <div class="girando" aria-hidden="true"></div>
      <p>Un momento, por favor…</p>
    </div>
  </div>

  <noscript>
    <p class="sin-js">Para usar el recortador hay que permitir JavaScript en el navegador.</p>
  </noscript>

  <script>
    // Si la página se abrió con doble clic (file://) los módulos no cargan: explicar qué hacer.
    (function () {
      function explicar() {
        if (window.__recortadorListo) return;
        var caja = document.getElementById('cargando');
        if (!caja) return;
        caja.innerHTML = '<h1>El recortador no se puede abrir así</h1>' +
          '<p>Este archivo no funciona con doble clic. Para abrir el recortador, haga doble clic en ' +
          '<strong>«Abrir Recortador»</strong> (en la carpeta del programa) o use el acceso directo del escritorio.</p>';
      }
      if (location.protocol === 'file:') document.addEventListener('DOMContentLoaded', explicar);
      else setTimeout(function () {
        if (window.__recortadorListo) return;
        var caja = document.getElementById('cargando');
        if (caja) caja.innerHTML = '<h1>El recortador no terminó de abrirse</h1>' +
          '<p>Cierre esta ventana y vuelva a abrir el recortador. Si sigue igual, use Google Chrome o Microsoft Edge.</p>';
      }, 15000);
    })();
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
